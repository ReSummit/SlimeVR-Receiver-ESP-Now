name: PlatformIO CI

on:
  push:
    branches: [esp8266, 'feature/**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Discover every [env:...] in platformio.ini so the build matrix stays in sync
  # with the boards automatically (including branch-specific envs like the 8266).
  list-envs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.envs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: envs
        run: |
          envs=$(grep -oP '^\[env:\K[^\]]+' platformio.ini \
                 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$envs" >> "$GITHUB_OUTPUT"
          echo "Discovered envs: $envs"

  build:
    needs: list-envs
    runs-on: ubuntu-latest
    name: build (${{ matrix.env }})
    strategy:
      fail-fast: false  # one board failing shouldn't hide the others' results
      matrix:
        env: ${{ fromJson(needs.list-envs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for scripts/firmware_version.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-
            pio-${{ runner.os }}-

      - name: Install PlatformIO & esptool
        run: pip install --upgrade platformio esptool

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      # Merge bootloader + partition table + otadata + app into ONE factory image
      # per board, named after the board and flashable at 0x0 (esptool or the web
      # flasher) with no per-chip offset math. The chip and its bootloader offset
      # are read straight from the built binary, so it's correct per target
      # (classic ESP32's bootloader is at 0x1000, every other target at 0x0).
      # ESP8266's firmware.bin is already a complete image, so it's copied as-is.
      - name: Merge factory image
        run: |
          src=".pio/build/${{ matrix.env }}"
          out="out/${{ matrix.env }}.bin"
          mkdir -p out
          if [ -f "$src/bootloader.bin" ]; then
            chip=$(esptool image-info "$src/firmware.bin" 2>/dev/null \
                   | grep -oiE 'ESP32(-[A-Z0-9]+)?' | head -1 | tr -d '-' | tr '[:upper:]' '[:lower:]')
            [ "$chip" = esp32 ] && bl=0x1000 || bl=0x0
            boot_app0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
            echo "Merging $chip factory image (bootloader @ $bl) -> $out"
            esptool --chip "$chip" merge-bin -o "$out" --flash-size keep \
              "$bl"   "$src/bootloader.bin" \
              0x8000  "$src/partitions.bin" \
              0xe000  "$boot_app0" \
              0x10000 "$src/firmware.bin"
          else
            cp "$src/firmware.bin" "$out"   # ESP8266: already a full flashable image
          fi

      # Matrix jobs can't append to a shared artifact, so each board uploads a
      # temporary per-board artifact; the bundle job below merges them into one.
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.env }}
          path: out/
          if-no-files-found: error

  # Merge every board's factory image into a single "firmware" artifact (one
  # firmware.zip containing all the <board>.bin files) for easy release attaching.
  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Combine per-board artifacts into one
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: bundle-*
          delete-merged: true  # drop the per-board artifacts, leaving just the bundle
