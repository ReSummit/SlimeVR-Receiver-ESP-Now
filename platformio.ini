; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; build_cache_dir = C:\Users\Alexander\AppData\Local\Programs\Microsoft VS Code\.cache
default_envs = Proton_Dongle

[env]
monitor_speed = 115200
monitor_echo = yes
monitor_filters = colorize
lib_deps = rlogiacco/CircularBuffer@^1.4.0
framework = arduino
extra_scripts = pre:scripts/firmware_version.py
build_flags = -std=gnu++2a
build_unflags = -std=gnu++11 -std=gnu++17
; build_type = debug
; monitor_port = COM37
; upload_port = COM29

[env:Proton_Dongle]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = Proton_Dongle
board_build.variants_dir = variants

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
board_build.variants_dir = variants

[env:slime_dongle_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-s3
board_build.variants_dir = variants

[env:slime_dongle_s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-s2
board_build.variants_dir = variants

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.variants_dir = variants