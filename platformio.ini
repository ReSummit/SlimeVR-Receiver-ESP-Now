; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; build_cache_dir = C:\Users\Alexander\AppData\Local\Programs\Microsoft VS Code\.cache
default_envs = Proton_Dongle

[env]
monitor_speed = 115200
monitor_echo = yes
monitor_filters = colorize
lib_deps = rlogiacco/CircularBuffer@^1.4.0
framework = arduino
extra_scripts = pre:scripts/firmware_version.py
build_flags = -std=gnu++2a
build_unflags = -std=gnu++11 -std=gnu++17
; build_type = debug
; monitor_port = COM37
; upload_port = COM29

[env:Proton_Dongle]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = Proton_Dongle
board_build.variants_dir = variants

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
board_build.variants_dir = variants

[env:slime_dongle_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-s3
board_build.variants_dir = variants

[env:slime_dongle_s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-s2
board_build.variants_dir = variants

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.variants_dir = variants

; --- Serial-only mode builds ---
; No USB HID; the dongle talks to SlimeVR over UART via slimevr_serial_bridge.py.
; SERIAL_USB_ONLY / SERIAL_BAUD_RATE are set in each board's variant pins_arduino.h.

[env:slime_dongle_c5_serial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-c5-serial
board_build.variants_dir = variants

[env:slime_dongle_c6_serial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-c6-serial
board_build.variants_dir = variants

[env:slime_dongle_s2_serial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-s2-serial
board_build.variants_dir = variants

[env:slime_dongle_8266]
platform = espressif8266 @ 4.2.1
board = esp12e
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
; High UART baud so tracker data can exceed the ~16 KB/s the host bridge wants.
; Keep the monitor in sync (note: binary frames will look like noise in a
; plain serial monitor; use bridge/slimevr_esp8266_bridge.py instead).
monitor_speed = 921600
; Decode crash backtraces automatically when using `pio device monitor`.
monitor_filters = esp8266_exception_decoder, colorize
lib_deps =
    rlogiacco/CircularBuffer@^1.4.0
build_flags =
    ; Match the shared C++ standard from [env] (kept explicit so it survives
    ; whether PlatformIO merges or replaces the parent build_flags).
    -std=gnu++2a
    ; The ESP8266 has no USB; these identify the device / pins for the shared code.
    -D SERIAL_BAUD_RATE=921600
    ; Lower this (e.g. 15) if the board browns out / resets under WiFi load.
    -D SLIME_TX_POWER_DBM=20.5f
    -D USB_VID=0x1209
    -D USB_PID=0x7690
    -D USB_PRODUCT="\"SlimeVR ESPNow Dongle 8266\""
    -D USB_MANUFACTURER="\"SlimeVR\""
    -D ARDUINO_VARIANT="\"esp12e\""
    ; Button: GPIO0 (flash button), active-low.
    -D USER_BUTTON=0
    -D USER_BUTTON_ACTIVE_LEVEL=false
    ; Onboard LED: GPIO2, active-low.
    -D LED_ACTIVE_LEVEL=0
    -D SERIAL_USB_ONLY